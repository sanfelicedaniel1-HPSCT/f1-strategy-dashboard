<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Pro Strategy Dashboard</title>
  <!-- Chart.js and Annotation Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #121212; color: #fff; }
    h1, h2 { color: #e10600; margin-bottom: 5px; }
    .controls { margin: 15px 0; display: flex; gap: 15px; flex-wrap: wrap; }
    select { padding: 8px; border-radius: 4px; background: #222; color: #fff; border: 1px solid #444; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .chart-container { position: relative; height: 420px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; font-size: 0.95rem; }
    th { color: #888; }
  </style>
</head>
<body>

  <h1>🏎️ F1 Live Strategy Dashboard</h1>
  <p id="session-info">Loading session...</p>

  <div class="controls">
    <label>
      Filter Drivers:
      <select id="driver-select" multiple size="5" onchange="renderDashboard()"></select>
    </label>
  </div>

  <div class="card">
    <h2>Lap Pace & Race Control Events</h2>
    <div class="chart-container">
      <canvas id="lapChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Strategy, Intervals & Top Speeds</h2>
    <table>
      <thead>
        <tr>
          <th>Driver</th>
          <th>Avg Pace</th>
          <th>Tire (Age)</th>
          <th>Gap to Lead</th>
          <th>Interval Ahead</th>
          <th>Est Pit Exit Delta</th>
          <th>Max Speed</th>
          <th>Pits</th>
        </tr>
      </thead>
      <tbody id="strategy-table"></tbody>
    </table>
  </div>

  <script>
    let sessionKey = null, driversMap = {}, lapsData = [], intervalsData = [], raceControlData = [], chartInstance = null;
    const PIT_LOSS_SECONDS = 22.0;

    async function init() {
      try {
        const sessionRes = await fetch('https://api.openf1.org/v1/sessions?session_key=latest');
        const session = (await sessionRes.json())[0];
        sessionKey = session.session_key;
        
        document.getElementById('session-info').innerText = 
          `${session.location} GP - ${session.session_name} (${session.year})`;

        await Promise.all([fetchDrivers(), fetchLaps(), fetchIntervals(), fetchRaceControl()]);
        populateDriverSelect();
        renderDashboard();
      } catch (err) {
        console.error("Error loading OpenF1 data:", err);
      }
    }

    async function fetchDrivers() {
      const res = await fetch(`https://api.openf1.org/v1/drivers?session_key=${sessionKey}`);
      (await res.json()).forEach(d => driversMap[d.driver_number] = d);
    }

    async function fetchLaps() {
      const res = await fetch(`https://api.openf1.org/v1/laps?session_key=${sessionKey}`);
      lapsData = await res.json();
    }

    async function fetchIntervals() {
      const res = await fetch(`https://api.openf1.org/v1/intervals?session_key=${sessionKey}`);
      intervalsData = await res.json();
    }

    async function fetchRaceControl() {
      const res = await fetch(`https://api.openf1.org/v1/race_control?session_key=${sessionKey}`);
      raceControlData = await res.json();
    }

    function populateDriverSelect() {
      const select = document.getElementById('driver-select');
      select.innerHTML = '<option value="ALL" selected>All Drivers</option>';
      
      Object.values(driversMap).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.driver_number;
        opt.innerText = `#${d.driver_number} - ${d.broadcast_name}`;
        select.appendChild(opt);
      });
    }

    function renderDashboard() {
      const selectedOpts = Array.from(document.getElementById('driver-select').selectedOptions).map(o => o.value);
      let filteredDriverNums = selectedOpts.includes('ALL') ? Object.keys(driversMap) : selectedOpts;
      updateChart(filteredDriverNums);
      updateTable(filteredDriverNums);
    }

    function getFlagAnnotations() {
      const annotations = {};
      let idx = 0;

      raceControlData.filter(rc => rc.category === 'Flag' || rc.flag?.includes('SAFETY CAR')).forEach(event => {
        if (!event.lap_number) return;

        let color = 'rgba(255, 215, 0, 0.15)';
        if (event.flag === 'VIRTUAL SAFETY CAR' || event.message?.includes('VSC')) color = 'rgba(255, 140, 0, 0.2)';
        else if (event.flag === 'SAFETY CAR' || event.message?.includes('SAFETY CAR')) color = 'rgba(255, 215, 0, 0.3)';
        else if (event.flag === 'RED') color = 'rgba(220, 53, 69, 0.3)';

        annotations[`flag_${idx++}`] = {
          type: 'box', xMin: event.lap_number - 0.5, xMax: event.lap_number + 0.5, backgroundColor: color, borderWidth: 0
        };
      });

      return annotations;
    }

    function updateChart(driverNums) {
      const datasets = driverNums.map(num => {
        const dLaps = lapsData.filter(l => l.driver_number == num && l.lap_duration);
        const driver = driversMap[num] || { broadcast_name: num, team_colour: 'FFFFFF' };

        return {
          label: driver.broadcast_name,
          data: dLaps.map(l => ({ x: l.lap_number, y: l.lap_duration })),
          borderColor: `#${driver.team_colour || 'ffffff'}`,
          backgroundColor: `#${driver.team_colour || 'ffffff'}`,
          tension: 0.1,
          pointRadius: dLaps.map(l => l.is_pit_out_lap ? 7 : 2),
          pointStyle: dLaps.map(l => l.is_pit_out_lap ? 'rectRot' : 'circle')
        };
      });

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('lapChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { annotation: { annotations: getFlagAnnotations() } },
          scales: {
            x: { type: 'linear', title: { display: true, text: 'Lap Number', color: '#888' } },
            y: { title: { display: true, text: 'Lap Time (Seconds)', color: '#888' } }
          }
        }
      });
    }

    function updateTable(driverNums) {
      const tbody = document.getElementById('strategy-table');
      tbody.innerHTML = '';

      driverNums.forEach(num => {
        const dLaps = lapsData.filter(l => l.driver_number == num);
        if (!dLaps.length) return;

        const driver = driversMap[num];
        const validLaps = dLaps.filter(l => l.lap_duration);
        const avgLap = (validLaps.reduce((acc, l) => acc + l.lap_duration, 0) / validLaps.length).toFixed(2);
        const latestLap = dLaps[dLaps.length - 1];
        const pitStops = dLaps.filter(l => l.is_pit_out_lap).length;

        const dIntervals = intervalsData.filter(i => i.driver_number == num);
        const latestInterval = dIntervals.length ? dIntervals[dIntervals.length - 1] : null;
        
        const gapToLeader = latestInterval?.gap_to_leader !== undefined 
          ? (latestInterval.gap_to_leader === 0 ? 'LEADER' : `+${latestInterval.gap_to_leader}s`)
          : 'N/A';

        const intervalAhead = latestInterval?.interval !== undefined 
          ? (latestInterval.interval === 0 ? '-' : `+${latestInterval.interval}s`)
          : 'N/A';

        let pitExitDelta = 'N/A';
        if (latestInterval?.gap_to_leader !== undefined) {
          pitExitDelta = `+${(latestInterval.gap_to_leader + PIT_LOSS_SECONDS).toFixed(1)}s`;
        }

        const maxSpeed = Math.max(...dLaps.map(l => l.st_speed || 0));

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${driver ? driver.broadcast_name : num}</strong></td>
          <td>${isNaN(avgLap) ? 'N/A' : avgLap + 's'}</td>
          <td>${latestLap?.compound || 'Unk'} (${latestLap?.tyre_age_at_start || 0} L)</td>
          <td>${gapToLeader}</td>
          <td>${intervalAhead}</td>
          <td style="color: #e10600;">${pitExitDelta}</td>
          <td>${maxSpeed > 0 ? maxSpeed + ' km/h' : 'N/A'}</td>
          <td>${pitStops}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    init();
  </script>
</body>
</html>
