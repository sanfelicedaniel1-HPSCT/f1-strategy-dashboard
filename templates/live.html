<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Live Hub — Scuderia San Felice</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #121212; color: #fff; }
    nav { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    nav a { color: #888; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
    nav a.active { color: #e10600; border-bottom: 2px solid #e10600; padding-bottom: 8px; }
    h1, h2 { color: #e10600; margin-bottom: 5px; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    .chart-container { position: relative; height: 420px; width: 100%; text-align: left; }
    #countdown-box { font-size: 2.5rem; font-weight: bold; margin: 20px 0; color: #00e676; letter-spacing: 2px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
    th, td { padding: 8px; border-bottom: 1px solid #333; font-size: 0.95rem; }
    th { color: #888; }
    .badge { background: #e10600; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="active">🔴 Live Session & Countdown</a>
    <a href="/historical">📜 Historical Vault</a>
  </nav>

  <!-- COUNTDOWN CARD (Shown when offline) -->
  <div id="countdown-card" class="card hidden">
    <h2>⏳ Next F1 Session Countdown</h2>
    <p id="next-session-title">Checking F1 Schedule...</p>
    <div id="countdown-box">00d 00h 00m 00s</div>
  </div>

  <!-- LIVE DASHBOARD CARD (Shown when practice, quali, or race is active) -->
  <div id="live-dashboard" class="hidden">
    <div class="card" style="text-align: left;">
      <h2><span class="badge">LIVE</span> <span id="session-info">Connecting to telemetry...</span></h2>
      <p id="session-type-sub" style="color: #888; margin-top: 5px;"></p>
    </div>

    <div class="card" style="text-align: left;">
      <h2>Live Pace & Track Events</h2>
      <div class="chart-container"><canvas id="lapChart"></canvas></div>
    </div>

    <div class="card" style="text-align: left;">
      <h2>Live Standings & Sector/Interval Data</h2>
      <table>
        <thead>
          <tr>
            <th>Driver</th><th>Best / Avg Pace</th><th>Tire (Age)</th><th>Gap to Lead</th>
            <th>Interval</th><th>Est Pit Exit Delta</th><th>Max Speed</th>
          </tr>
        </thead>
        <tbody id="strategy-table"></tbody>
      </table>
    </div>
  </div>

  <script>
    let sessionKey = null, driversMap = {}, lapsData = [], intervalsData = [], raceControlData = [], chartInstance = null;
    const PIT_LOSS_SECONDS = 22.0;

    async function checkLiveStatus() {
      try {
        const res = await fetch('https://api.openf1.org/v1/sessions?session_key=latest');
        const sessions = await res.json();
        
        if (!sessions.length) {
          showCountdown(null);
          return;
        }

        const latestSession = sessions[0];
        const sessionEnd = new Date(latestSession.date_end);
        const sessionStart = new Date(latestSession.date_start);
        const now = new Date();

        // Check if session is active right now (or ended in the last 45 minutes)
        if (now >= sessionStart && now <= new Date(sessionEnd.getTime() + 45 * 60000)) {
          document.getElementById('live-dashboard').classList.remove('hidden');
          document.getElementById('countdown-card').classList.add('hidden');
          sessionKey = latestSession.session_key;
          
          document.getElementById('session-info').innerText = `${latestSession.location} GP — ${latestSession.session_name}`;
          document.getElementById('session-type-sub').innerText = `Session Type: ${latestSession.session_type} (${latestSession.year})`;
          initLiveDashboard();
        } else {
          showCountdown(latestSession);
        }
      } catch (err) {
        console.error("Schedule check failed:", err);
      }
    }

    function showCountdown(nextSession) {
      document.getElementById('countdown-card').classList.remove('hidden');
      document.getElementById('live-dashboard').classList.add('hidden');

      let targetDate = nextSession ? new Date(nextSession.date_start) : new Date(Date.now() + 86400000 * 3);
      if (targetDate <= new Date()) targetDate = new Date(Date.now() + 86400000 * 3);

      if (nextSession) {
        document.getElementById('next-session-title').innerText = `${nextSession.location} GP — ${nextSession.session_name}`;
      }

      function updateTimer() {
        const diff = targetDate - new Date();
        if (diff <= 0) {
          location.reload();
          return;
        }
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / 1000 / 60) % 60);
        const s = Math.floor((diff / 1000) % 60);
        document.getElementById('countdown-box').innerText = 
          `${String(d).padStart(2,'0')}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
      }
      
      updateTimer();
      setInterval(updateTimer, 1000);
    }

    async function initLiveDashboard() {
      await loadLiveData();
      setInterval(loadLiveData, 15000); // Poll every 15s
    }

    async function loadLiveData() {
      const [dRes, lRes, iRes, rRes] = await Promise.all([
        fetch(`https://api.openf1.org/v1/drivers?session_key=${sessionKey}`),
        fetch(`https://api.openf1.org/v1/laps?session_key=${sessionKey}`),
        fetch(`https://api.openf1.org/v1/intervals?session_key=${sessionKey}`),
        fetch(`https://api.openf1.org/v1/race_control?session_key=${sessionKey}`)
      ]);

      (await dRes.json()).forEach(d => driversMap[d.driver_number] = d);
      lapsData = await lRes.json();
      intervalsData = await iRes.json();
      raceControlData = await rRes.json();

      renderLiveChart();
      renderLiveTable();
    }

    function renderLiveChart() {
      const driverNums = Object.keys(driversMap);
      const datasets = driverNums.map(num => {
        const dLaps = lapsData.filter(l => l.driver_number == num && l.lap_duration);
        const driver = driversMap[num] || { broadcast_name: num, team_colour: 'FFFFFF' };
        return {
          label: driver.broadcast_name,
          data: dLaps.map(l => ({ x: l.lap_number, y: l.lap_duration })),
          borderColor: `#${driver.team_colour || 'ffffff'}`,
          backgroundColor: `#${driver.team_colour || 'ffffff'}`,
          tension: 0.1,
          pointRadius: dLaps.map(l => l.is_pit_out_lap ? 7 : 2),
          pointStyle: dLaps.map(l => l.is_pit_out_lap ? 'rectRot' : 'circle')
        };
      });

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('lapChart').getContext('2d'), {
        type: 'line',
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { type: 'linear', title: { display: true, text: 'Lap Number', color: '#888' } },
            y: { title: { display: true, text: 'Lap Time (s)', color: '#888' } }
          }
        }
      });
    }

    function renderLiveTable() {
      const tbody = document.getElementById('strategy-table');
      tbody.innerHTML = '';
      Object.keys(driversMap).forEach(num => {
        const dLaps = lapsData.filter(l => l.driver_number == num);
        if (!dLaps.length) return;
        const driver = driversMap[num];
        const validLaps = dLaps.filter(l => l.lap_duration);
        const avgLap = (validLaps.reduce((acc, l) => acc + l.lap_duration, 0) / validLaps.length).toFixed(2);
        const latestLap = dLaps[dLaps.length - 1];
        const dIntervals = intervalsData.filter(i => i.driver_number == num);
        const latestInterval = dIntervals.length ? dIntervals[dIntervals.length - 1] : null;

        const gapToLeader = latestInterval?.gap_to_leader !== undefined ? (latestInterval.gap_to_leader === 0 ? 'LEADER' : `+${latestInterval.gap_to_leader}s`) : 'N/A';
        const intervalAhead = latestInterval?.interval !== undefined ? (latestInterval.interval === 0 ? '-' : `+${latestInterval.interval}s`) : 'N/A';
        const pitExitDelta = latestInterval?.gap_to_leader !== undefined ? `+${(latestInterval.gap_to_leader + PIT_LOSS_SECONDS).toFixed(1)}s` : 'N/A';
        const maxSpeed = Math.max(...dLaps.map(l => l.st_speed || 0));

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${driver ? driver.broadcast_name : num}</strong></td>
          <td>${isNaN(avgLap) ? 'N/A' : avgLap + 's'}</td>
          <td>${latestLap?.compound || 'Unk'} (${latestLap?.tyre_age_at_start || 0} L)</td>
          <td>${gapToLeader}</td>
          <td>${intervalAhead}</td>
          <td style="color: #e10600;">${pitExitDelta}</td>
          <td>${maxSpeed > 0 ? maxSpeed + ' km/h' : 'N/A'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    checkLiveStatus();
  </script>
</body>
</html>
