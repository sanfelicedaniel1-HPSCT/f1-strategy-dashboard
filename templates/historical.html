<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Historical Vault — Scuderia San Felice</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #121212; color: #fff; }
    nav { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    nav a { color: #888; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
    nav a.active { color: #e10600; border-bottom: 2px solid #e10600; padding-bottom: 8px; }
    h1, h2 { color: #e10600; margin-bottom: 5px; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; background: #1e1e1e; padding: 15px; border-radius: 8px; }
    select, button { padding: 10px; border-radius: 4px; background: #222; color: #fff; border: 1px solid #444; font-size: 1rem; }
    button { background: #e10600; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #ff1e1e; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .chart-container { position: relative; height: 420px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; font-size: 0.95rem; }
    th { color: #888; }
  </style>
</head>
<body>

  <nav>
    <a href="/">🔴 Live Session & Countdown</a>
    <a href="/historical" class="active">📜 Historical Vault</a>
  </nav>

  <h1>📜 Historical Session Search</h1>

  <div class="controls">
    <label>Year:
      <select id="year-select" onchange="loadSessions()">
        <option value="2024" selected>2024</option>
        <option value="2023">2023</option>
      </select>
    </label>

    <label>Session:
      <select id="session-select"></select>
    </label>

    <button onclick="fetchHistoricalData()">Load Race Telemetry</button>
  </div>

  <div class="card">
    <h2 id="session-title">Select a Session Above</h2>
    <div class="chart-container"><canvas id="lapChart"></canvas></div>
  </div>

  <div class="card">
    <h2>Historical Race Strategy Summary</h2>
    <table>
      <thead>
        <tr>
          <th>Driver</th><th>Avg Pace</th><th>Tire Compound</th><th>Max Speed</th><th>Total Pit Stops</th>
        </tr>
      </thead>
      <tbody id="strategy-table"></tbody>
    </table>
  </div>

  <script>
    let driversMap = {}, lapsData = [], chartInstance = null;

    async function loadSessions() {
      const year = document.getElementById('year-select').value;
      const res = await fetch(`https://api.openf1.org/v1/sessions?year=${year}&session_type=Race`);
      const sessions = await res.json();
      const select = document.getElementById('session-select');
      select.innerHTML = '';
      
      sessions.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.session_key;
        opt.innerText = `${s.location} GP (${s.session_name})`;
        select.appendChild(opt);
      });
    }

    async function fetchHistoricalData() {
      const sessionKey = document.getElementById('session-select').value;
      const sessionTitle = document.getElementById('session-select').selectedOptions[0].innerText;
      document.getElementById('session-title').innerText = sessionTitle;

      const [dRes, lRes] = await Promise.all([
        fetch(`https://api.openf1.org/v1/drivers?session_key=${sessionKey}`),
        fetch(`https://api.openf1.org/v1/laps?session_key=${sessionKey}`)
      ]);

      (await dRes.json()).forEach(d => driversMap[d.driver_number] = d);
      lapsData = await lRes.json();

      renderChart();
      renderTable();
    }

    function renderChart() {
      const datasets = Object.keys(driversMap).map(num => {
        const dLaps = lapsData.filter(l => l.driver_number == num && l.lap_duration);
        const driver = driversMap[num] || { broadcast_name: num, team_colour: 'FFFFFF' };
        return {
          label: driver.broadcast_name,
          data: dLaps.map(l => ({ x: l.lap_number, y: l.lap_duration })),
          borderColor: `#${driver.team_colour || 'ffffff'}`,
          backgroundColor: `#${driver.team_colour || 'ffffff'}`,
          tension: 0.1,
          pointRadius: dLaps.map(l => l.is_pit_out_lap ? 7 : 2),
          pointStyle: dLaps.map(l => l.is_pit_out_lap ? 'rectRot' : 'circle')
        };
      });

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById('lapChart').getContext('2d'), {
        type: 'line',
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { type: 'linear', title: { display: true, text: 'Lap Number', color: '#888' } },
            y: { title: { display: true, text: 'Lap Time (Seconds)', color: '#888' } }
          }
        }
      });
    }

    function renderTable() {
      const tbody = document.getElementById('strategy-table');
      tbody.innerHTML = '';
      Object.keys(driversMap).forEach(num => {
        const dLaps = lapsData.filter(l => l.driver_number == num);
        if (!dLaps.length) return;
        const driver = driversMap[num];
        const validLaps = dLaps.filter(l => l.lap_duration);
        const avgLap = (validLaps.reduce((acc, l) => acc + l.lap_duration, 0) / validLaps.length).toFixed(2);
        const latestLap = dLaps[dLaps.length - 1];
        const maxSpeed = Math.max(...dLaps.map(l => l.st_speed || 0));
        const pitStops = dLaps.filter(l => l.is_pit_out_lap).length;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${driver ? driver.broadcast_name : num}</strong></td>
          <td>${isNaN(avgLap) ? 'N/A' : avgLap + 's'}</td>
          <td>${latestLap?.compound || 'Unk'}</td>
          <td>${maxSpeed > 0 ? maxSpeed + ' km/h' : 'N/A'}</td>
          <td>${pitStops}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadSessions();
  </script>
</body>
</html>
